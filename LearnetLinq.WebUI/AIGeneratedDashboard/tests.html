<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Airtel dashboard tests</title><style>body{font:14px Segoe UI,sans-serif;padding:25px}iframe{width:1440px;height:1000px;border:1px solid #ddd}.pass{color:#14785f}.fail{color:#b32222}</style></head><body data-test-status="running"><h1>AIGeneratedDashboard tests</h1><ol id="results"></ol><iframe id="app" src="index.html" title="Dashboard under test"></iframe><script>
'use strict';
document.getElementById('app').addEventListener('load', function () {
  const win = this.contentWindow, doc = win.document, api = win.AirtelDashboard, data = win.AirtelData;
  let failed = 0, passed = 0;
  function test(name, fn) { const li = document.createElement('li'); try { fn(); passed++; li.className = 'pass'; li.textContent = 'PASS: ' + name; } catch (error) { failed++; li.className = 'fail'; li.textContent = 'FAIL: ' + name + ': ' + error.message; } document.getElementById('results').appendChild(li); }
  function assert(value, message) { if (!value) throw new Error(message || 'Assertion failed'); }
  function change(id, value) { doc.getElementById(id).value = value; doc.getElementById(id).dispatchEvent(new win.Event('change')); }
  function click(selector) { doc.querySelector(selector).click(); }
  const all = { period: 'all', circle: 'all', course: 'all' };
  test('Synthetic dataset has 480 learners and 42 batches', () => { assert(data.learners.length === 480); assert(data.batches.length === 42); assert(data.enrollments.length > 1200); });
  test('IDs are unique', () => { ['learners','batches','enrollments'].forEach(key => assert(new Set(data[key].map(r => r.id)).size === data[key].length)); });
  test('Every enrollment has valid learner, program and batch references', () => { data.enrollments.forEach(r => { const batch = data.batches.find(b => b.id === r.batchId); assert(data.learners.some(l => l.id === r.learnerId)); assert(data.programs.some(p => p.id === r.programId)); assert(batch && batch.circle === r.circle && batch.programId === r.programId); }); });
  test('Each learner is unique within a batch and capacity is respected', () => { data.batches.forEach(b => { const entries = data.enrollments.filter(r => r.batchId === b.id); assert(new Set(entries.map(r => r.learnerId)).size === entries.length); assert(entries.length <= b.capacity); }); });
  test('Completion dates and scores are consistent with status', () => { data.enrollments.forEach(r => { assert(r.enrolledAt <= data.snapshot); assert(r.due >= r.enrolledAt); if (r.status === 'Completed') { assert(r.progress === 100); assert(r.completedAt >= r.enrolledAt && r.completedAt <= data.snapshot); assert(r.score >= 0 && r.score <= 100); } else { assert(r.progress < 100); assert(r.score === null && r.completedAt === null); } }); });
  test('Status counts reconcile to total enrollments', () => { const s = api.summary(data.enrollments); assert(s.completed + s.inProgress + s.notStarted === s.enrolled); assert(s.passed <= s.assessed); assert(s.assessed === s.completed); });
  test('Metric math against independently specified fixture', () => { const s = api.summary([{learnerId:'A',status:'Completed',score:70,due:'2026-09-01'},{learnerId:'A',status:'Completed',score:69,due:'2026-09-01'},{learnerId:'B',status:'In progress',score:null,due:'2026-10-13'},{learnerId:'C',status:'Not started',score:null,due:'2026-10-14'}]); assert(s.learners===3 && s.enrolled===4 && s.completed===2 && s.passed===1 && s.assessed===2 && s.overdue===1); assert(api.pct(s.completed,s.enrolled)==='50.0%'); assert(api.pct(s.passed,s.assessed)==='50.0%'); });
  test('Empty denominators produce a dash without NaN', () => { assert(api.pct(0,0)==='—'); const s=api.summary([]); assert(s.enrolled===0 && s.learners===0 && s.passed===0); });
  test('Completed and snapshot-day due training are not overdue', () => { assert(!api.overdue({status:'Completed',due:'2026-01-01'})); assert(!api.overdue({status:'In progress',due:'2026-10-14'})); assert(api.overdue({status:'Not started',due:'2026-10-13'})); });
  test('October filter excludes earlier enrollment months', () => { const r=api.selectRows({...all,period:'month'}); assert(r.length>0 && r.every(x=>x.enrolledAt.startsWith('2026-10'))); });
  test('Quarter filter starts in August', () => { assert(api.selectRows({...all,period:'quarter'}).every(r=>r.enrolledAt>='2026-08-01')); });
  test('Combined circle and course filters intersect', () => { const r=api.selectRows({...all,circle:'Delhi NCR',course:'P01'}); assert(r.length>0 && r.every(x=>x.circle==='Delhi NCR'&&x.programId==='P01')); });
  test('Batch aggregates reconcile to selected enrollments', () => { const b=api.batchRows(data.enrollments); assert(b.reduce((n,x)=>n+x.enrolled,0)===data.enrollments.length); });
  test('CSV quotes commas, line breaks and quotes', () => { const result=api.csv(['Header'],[['a,b'],['a"b'],['a\nb']]); assert(result.includes('"a,b"')); assert(result.includes('"a""b"')); assert(result.includes('"a\nb"')); });
  test('CSV formula injection is neutralized', () => { const result=api.csv(['H'],[['=1+1'],['@SUM(1)'],['+1'],['-2']]); assert(result.includes('"\'=1+1"')); assert(result.includes('"\'@SUM(1)"')); assert(result.includes('"\'+1"')); assert(result.includes('"\'-2"')); });
  test('Initial render has four KPIs, chart and eight batch rows', () => { assert(doc.querySelectorAll('.metric').length===4); assert(doc.querySelector('#trend-chart svg')); assert(doc.querySelectorAll('#records-body tr').length===8); });
  test('Circle filter updates all record rows and KPI totals', () => { change('circle','Delhi NCR'); const expected=api.summary(api.selectRows({...all,circle:'Delhi NCR'})); assert(doc.querySelector('.metric-value').textContent===expected.learners.toLocaleString('en-IN')); assert(doc.querySelectorAll('#circle-table tr').length===1); });
  test('No matching selection renders safe empty states', () => { change('period','month'); change('course','P01'); assert(doc.querySelector('#records-body').textContent.includes('No records')); assert(!doc.getElementById('main').textContent.includes('NaN')); });
  test('Reset restores filters and dataset', () => { click('#reset'); assert(doc.getElementById('circle').value==='all'); assert(doc.getElementById('period').value==='all'); assert(doc.getElementById('course').value==='all'); assert(doc.querySelectorAll('#circle-table tr').length===6); });
  test('Search is case insensitive and narrows batch list', () => { const input=doc.getElementById('search'); input.value='atl-26-001'; input.dispatchEvent(new win.Event('input')); assert(doc.querySelectorAll('#records-body tr').length===1); assert(doc.getElementById('records-body').textContent.includes('ATL-26-001')); });
  test('Unknown search displays empty state and disables pagination', () => { const input=doc.getElementById('search'); input.value='no-such-batch'; input.dispatchEvent(new win.Event('input')); assert(doc.getElementById('records-body').textContent.includes('No records')); assert(doc.getElementById('next').disabled); click('#reset'); });
  test('Pagination changes rows and previous restores first page', () => { const before=doc.getElementById('records-body').textContent; click('#next'); assert(doc.getElementById('records-body').textContent!==before); assert(!doc.getElementById('previous').disabled); click('#previous'); assert(doc.getElementById('records-body').textContent===before); });
  test('Needs attention filter only contains overdue batches', () => { click('[data-risk="risk"]'); assert([...doc.querySelectorAll('#records-body tr')].every(r=>r.textContent.includes('Needs attention'))); click('[data-risk="all"]'); });
  test('Batch detail modal opens with correct ID and closes', () => { const button=doc.querySelector('[data-batch]'); const id=button.dataset.batch; button.click(); assert(doc.getElementById('details').open); assert(doc.getElementById('detail-title').textContent.includes(id)); assert(doc.querySelectorAll('#detail-body tbody tr').length===10); click('#close-dialog'); assert(!doc.getElementById('details').open); });
  test('Circle drilldown updates the shared filter', () => { click('[data-circle="Karnataka"]'); assert(doc.getElementById('circle').value==='Karnataka'); click('#reset'); });
  test('Insight opens overdue learner view with correct headers', () => { click('[data-insight-view="learners"]'); assert(!doc.getElementById('records-panel').hidden); assert(doc.getElementById('overview-view').hidden); assert(doc.getElementById('records-title').textContent==='Learner progress'); assert([...doc.querySelectorAll('#records-body tr')].every(r=>r.textContent.includes('Overdue'))); });
  test('Navigation controls have accessible names', () => { assert([...doc.querySelectorAll('nav a')].every(a=>a.textContent.trim().length>0)); assert(doc.querySelector('.skip')); assert(doc.querySelector('#close-dialog').getAttribute('aria-label')); });
  test('Learner navigation supports completed record filter', () => { win.location.hash='learners'; win.dispatchEvent(new win.HashChangeEvent('hashchange')); click('[data-risk="complete"]'); assert([...doc.querySelectorAll('#records-body tr')].every(r=>r.textContent.includes('Completed'))); });
  test('CSV download contains every filtered learner record across pages', () => {
    const OriginalBlob=win.Blob, originalClick=win.HTMLAnchorElement.prototype.click, originalUrl=win.URL.createObjectURL;
    let content='', filename='';
    win.Blob=class extends OriginalBlob { constructor(parts,options) { super(parts,options); content=parts.join(''); } };
    win.HTMLAnchorElement.prototype.click=function(){filename=this.download;}; win.URL.createObjectURL=()=> 'blob:dashboard-test';
    try { click('#export'); assert(filename.includes('learners')); assert(content.split('\r\n').length-1===api.summary(data.enrollments).completed); assert(content.includes('"Synthetic"')); assert(content.split('\r\n').length>9); }
    finally { win.Blob=OriginalBlob; win.HTMLAnchorElement.prototype.click=originalClick; win.URL.createObjectURL=originalUrl; }
  });
  test('Reports navigation shows current-scope summary and hides record table', () => { win.location.hash='reports'; win.dispatchEvent(new win.HashChangeEvent('hashchange')); assert(!doc.getElementById('reports-view').hidden); assert(doc.getElementById('records-panel').hidden); assert(doc.getElementById('report-summary').textContent.includes('Completion rate')); });
  test('Summary export reports snapshot and synthetic type', () => {
    const OriginalBlob=win.Blob, originalClick=win.HTMLAnchorElement.prototype.click, originalUrl=win.URL.createObjectURL;
    let content='', filename=''; win.Blob=class extends OriginalBlob { constructor(parts,options){super(parts,options);content=parts.join('');} }; win.HTMLAnchorElement.prototype.click=function(){filename=this.download;}; win.URL.createObjectURL=()=> 'blob:summary-test';
    try { click('#export-summary'); assert(filename.includes('summary')); assert(content.includes('2026-10-14')); assert(content.includes('"Synthetic"')); assert(content.includes('"CompletionRate"')); }
    finally { win.Blob=OriginalBlob; win.HTMLAnchorElement.prototype.click=originalClick; win.URL.createObjectURL=originalUrl; }
  });
  test('Mobile layout fits a 390px viewport without page overflow', () => { win.location.hash='overview'; win.dispatchEvent(new win.HashChangeEvent('hashchange')); document.getElementById('app').style.width='390px'; assert(doc.documentElement.scrollWidth<=win.innerWidth, 'scrollWidth='+doc.documentElement.scrollWidth+', viewport='+win.innerWidth); });
  document.body.dataset.testStatus=failed ? 'failed' : 'passed'; document.body.dataset.passed=passed; document.body.dataset.failed=failed;
  const result=document.createElement('h2'); result.id='test-summary'; result.textContent=passed+' passed, '+failed+' failed'; document.body.insertBefore(result,document.getElementById('results'));
});
</script></body></html>
